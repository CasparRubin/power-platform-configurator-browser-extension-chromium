name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify naming, lint, typecheck, and tests
        run: |
          npm run verify:naming
          npm run lint
          npm run typecheck
          npm run test

      - name: Build
        run: npm run build
